# Preparation only. Replace placeholders and pin IMAGE_DIGEST after a verified build.
# Do not apply until both user deployment confirmations are recorded.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dream-events-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_ID
    spec:
      serviceAccountName: dream-events-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 10
      timeoutSeconds: 180
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/dream-events/api@sha256:IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          env:
            - name: NODE_ENV
              value: production
            - name: CLOUD_SQL_CONNECTION_NAME
              value: PROJECT_ID:REGION:INSTANCE_ID
            - name: PG_POOL_MAX
              value: '2'
            - name: CORS_ORIGINS
              value: https://ADMIN_DOMAIN,https://SCANNER_DOMAIN
            - name: PUBLIC_BASE_URL
              value: https://ADMIN_DOMAIN
            - name: TRUST_PROXY_HOPS
              value: '1'
            - name: EMAIL_ENABLED
              value: 'false'
            - name: EMAIL_PROVIDER
              value: gmail
            - name: FIREBASE_AUTH_BRIDGE_ENABLED
              value: 'false'
            - name: FIREBASE_AUTH_NATIVE_ENABLED
              value: 'false'
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: NODE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dream-events-database-url
                  key: '1'
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dream-events-encryption-key
                  key: '1'
